site_name: Learning Git
site_description: Notes and exercises for learning Git
site_url: https://scyne-sam.github.io/Learning-Git/
repo_url: https://github.com/Scyne-Sam/Learning-Git
repo_name: Scyne-Sam/Learning-Git
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - search.highlight

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/status.css

plugins:
  - search

nav:
  - Home: index.md
  - Validation checks: validation.md
  - Failure examples: failures.md
  - Commit log: commits/index.md

not_in_nav: |
  commits/*.md
